[project]
name = "voiceeval"
version = "0.1.0"
description = "Scalable evaluation platform for AI voice-agent call recordings (dual-channel human vs AI)."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
llm = ["anthropic>=1.15", "openai>=1.40", "google-genai>=1.30"]
asr = ["faster-whisper>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
all = ["voiceeval[llm,asr,postgres,dev]"]

[project.scripts]
voiceeval = "voiceeval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voiceeval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
